<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}見積システム{% endblock %} | mosaique</title>
<style>
  :root { --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --bg:#f6f8fa; --accent:#1f6feb; --danger:#cf222e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; color:var(--fg); background:var(--bg); font-size:14px; }
  header.nav { background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header.nav strong { font-size:16px; margin-right:8px; }
  header.nav a { color:var(--fg); text-decoration:none; }
  header.nav a:hover { color:var(--accent); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  table { border-collapse:collapse; width:100%; }
  th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:middle; }
  th { background:var(--bg); font-weight:600; white-space:nowrap; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  input, select, textarea { font:inherit; padding:5px 7px; border:1px solid var(--line); border-radius:6px; width:100%; background:#fff; }
  textarea { min-height:70px; }
  label { display:block; font-size:12px; color:var(--muted); margin-bottom:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .btn { display:inline-block; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--fg); text-decoration:none; cursor:pointer; font:inherit; white-space:nowrap; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.danger { color:var(--danger); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .flash { background:#dafbe1; border:1px solid #4ac26b; padding:8px 12px; border-radius:6px; margin-bottom:12px; }
  .muted { color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:var(--bg); border:1px solid var(--line); }
  .badge.受注 { background:#dafbe1; border-color:#4ac26b; }
  .badge.提出済 { background:#ddf4ff; border-color:#54aeff; }
  .badge.失注 { background:#ffebe9; border-color:#ff8182; }
  .scroll { overflow-x:auto; }
  form.inline { display:inline; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="nav no-print">
  <strong>mosaique 見積</strong>
  <a href="{{ url_for('estimate.index') }}">見積一覧</a>
  <a href="{{ url_for('estimate.new') }}">新規見積</a>
  <a href="{{ url_for('estimate.items') }}">単価マスタ</a>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash no-print">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
